name: Daily Exchange Rate Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run extraction and analysis
        run: |
          mkdir -p data
          python src/extract_rates.py
          python src/analyze_data.py
          python src/create_dashboard.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # This line is the key fix - it adds all new folders
          git add data/ reports/ exchange_warehouse.db || echo "No changes to add"
          git commit -m "Automated update: Data, SQL, and Dashboard: $(date)" || exit 0
          git push
